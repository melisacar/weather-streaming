apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescaledb
  namespace: weather-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:latest-pg16
        imagePullPolicy: Never
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: weather-secrets
              key: TIMESCALE_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: weather-secrets
              key: TIMESCALE_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: weather-config
              key: TIMESCALE_DB
        volumeMounts:
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: init-sql
        configMap:
          name: timescale-init